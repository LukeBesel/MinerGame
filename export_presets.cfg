; Hand-authored (no editor access in this build environment — see docs/ARCHITECTURE.md, "no
; editor, no --import"). Section/key names below are verified against strings embedded in the
; Godot 4.5 stable binary itself, not guessed. Advanced per-platform fields not set here (icons,
; codesign identities, entitlements, PWA icons, …) fall back to the exporter's own defaults —
; run one interactive "Export" dialog pass once export templates + real signing assets exist to
; confirm/backfill those. See src/save/INTEGRATION_NOTES.md for the validation status of this file.

